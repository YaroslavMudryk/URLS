version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: local_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: urls-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: local_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server --appendonly yes --appendfsync everysec --save 60 1

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urls_api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=urls-db;Username=user;Password=password"
      Redis__ConnectionString: "redis:6379"
    ports:
      - "8080:8080"
      - "8081:8081"

volumes:
  postgres_data:
  redis_data:
